# Intentional omissions of slash-parent `fields` / `moreFields` inheritance.
#
# Add an entry when a preset deliberately defines an explicit field list without
# `{parent}` and without inheriting some parent fields. Record `missedFieldIds`
# as a snapshot — CI fails when the live schema no longer matches (stale override).
#
# `fields` and `moreFields` are independent: you may record only one list when
# the other still inherits via `{parent}` or remains unreviewed. Omitting a list
# key is valid; extra keys with no live detection are stale.
#
# Within one list, `missedFieldIds` may be a **subset** of the live detection
# (document obvious skips first; remaining ids stay unreviewed). Stale means the
# override references field ids that are no longer missing from the parent.
#
# Entries are usually added from the Tagging Schema Browser audit pages (issue →
# PR workflow). See `.agents/skills/apply-schema-override/SKILL.md`.
#
# `fields` and `moreFields` are both audited when explicitly defined without
# `{parent}`. Overrides are per-list snapshots, not a single "preset is OK" flag.
# You may record one list while the other stays unreviewed (partial override);
# overall status remains unreviewed until every detected list is documented.
# Extra keys with no live detection are stale.
#
# CI validates against the published npm release dist (see validate-inheritance-overrides).
#
# Example from id-tagging-schema: tourism/information/terminal.json lists only
# `operator` in fields (not `{tourism/information}`) while moreFields inherits
# from the parent via `{tourism/information}`.
#
#   tourism/information/terminal:
#     fields:
#       parentId: tourism/information
#       missedFieldIds:
#         - address
#         - building_area_yes
