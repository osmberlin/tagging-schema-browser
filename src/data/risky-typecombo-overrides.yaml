# Intentional typeCombo fields on presets with fixed feature tags.
#
# Add an entry when a typeCombo field is deliberately kept even though it can
# write `key=yes` in iD. Record `fieldIds` as a snapshot — CI fails when live
# detection no longer matches (stale override).
#
# CI validates against the published npm release dist (see validate-risky-typecombo-overrides).
version: 1
presets:
  power/generator:
    fieldIds:
      - generator/output/electricity
  power/generator/method/photovoltaic:
    fieldIds:
      - generator/output/electricity
  power/generator/method/photovoltaic/building/roof:
    fieldIds:
      - generator/output/electricity
  power/generator/method/photovoltaic/location/roof:
    fieldIds:
      - generator/output/electricity
  power/generator/source/hydro:
    fieldIds:
      - generator/output/electricity
  power/generator/source/nuclear:
    fieldIds:
      - generator/output/electricity
  power/generator/source/wind:
    fieldIds:
      - generator/output/electricity
  power/plant:
    fieldIds:
      - plant/output/electricity
  power/plant/source/coal:
    fieldIds:
      - plant/output/electricity
  power/plant/source/gas:
    fieldIds:
      - plant/output/electricity
  power/plant/source/hydro:
    fieldIds:
      - plant/output/electricity
  power/plant/source/nuclear:
    fieldIds:
      - plant/output/electricity
  highway/traffic_sign:
    fieldIds:
      - traffic_sign
  power/plant/source/wind:
    fieldIds:
      - plant/output/electricity
