# Auto-merge low-risk Dependabot PRs after CI passes.
# Policy: .agents/skills/review-dependabot/SKILL.md (patch/minor only; majors need human review).
# Replaces the Cursor Approval Agent approach from #104 (approve-only, never triggered on Dependabot).
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch deploy-pages.yml after merging

# One run per PR; a new push (e.g. a Dependabot rebase) cancels the run waiting on the old head.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'app/dependabot'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Decide if this bump is auto-merge eligible
        id: qualify
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          qualifies=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              qualifies=true
              ;;
          esac
          if [ "$qualifies" = false ]; then
            if echo "$PR_TITLE" | grep -qiE 'minor-patch|misc-patch|icon-libraries|security-dev-tools'; then
              qualifies=true
            fi
          fi
          echo "eligible=$qualifies" >> "$GITHUB_OUTPUT"
          if [ "$qualifies" = false ]; then
            echo "Skipping auto-merge ($UPDATE_TYPE): major or ungrouped bump needs manual review."
          fi

      - name: Comment when manual review is required
        if: steps.qualify.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body '🤖 **Dependabot auto-merge skipped** — this bump needs manual review (semver-major or ungrouped update). See [.agents/skills/review-dependabot/SKILL.md](https://github.com/osmberlin/tagging-schema-browser/blob/main/.agents/skills/review-dependabot/SKILL.md).'

      # The repo has no required status checks, so merge only once every other check on this PR
      # has succeeded. This job's own check ("auto-merge") is excluded, or it would wait on itself.
      - name: Wait for all checks, then rebase-merge
        if: steps.qualify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF_CHECK: auto-merge
          REQUIRED_CHECK: Check # must be registered before we trust an otherwise empty list
        run: |
          deadline=$((SECONDS + 1500))
          while true; do
            # shellcheck disable=SC2016 # env.* is jq, not shell
            state=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
              [.statusCheckRollup[] | select((.name // .context) != env.SELF_CHECK)] as $c
              | if any($c[]; (.conclusion // .state) | IN("FAILURE","ERROR","CANCELLED","TIMED_OUT","ACTION_REQUIRED","STARTUP_FAILURE","STALE")) then "fail"
                elif ($c | any(.[]; .name == env.REQUIRED_CHECK))
                  and ($c | all(.[]; (.conclusion // .state) | IN("SUCCESS","NEUTRAL","SKIPPED"))) then "pass"
                else "pending" end')
            echo "Checks: $state"
            [ "$state" = pass ] && break
            if [ "$state" = fail ]; then
              echo "::error::A check failed; not merging PR #$PR_NUMBER."
              gh pr comment "$PR_NUMBER" --body '🤖 **Dependabot auto-merge stopped** — a check failed, so this PR was not merged.'
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Checks did not finish in time; not merging PR #$PR_NUMBER."
              exit 1
            fi
            sleep 20
          done
          gh pr merge "$PR_NUMBER" --rebase --delete-branch --match-head-commit "$HEAD_SHA"

      # Pushes made with GITHUB_TOKEN do not trigger `push` workflows, so deploy explicitly.
      - name: Deploy to GitHub Pages
        if: steps.qualify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --ref main
