# Turns a schema override issue (opened from the audit pages of the Tagging Schema Browser)
# into a PR that updates src/data/*-overrides.yaml. No agent involved: the issue carries a
# machine-readable ```json override-changes block, see src/components/PageAudits/overrideChanges.ts.
#
# Runs automatically when a trusted user (owner/member/collaborator) opens such an issue.
# Re-run via "Run workflow" with the issue number, e.g. after a merge conflict: the branch is
# rebuilt from the latest main, so conflicts resolve themselves.
#
# PRs created with the default GITHUB_TOKEN do not trigger `pull_request` CI, so CI is dispatched
# explicitly on the PR branch (its checks show up on the PR by head SHA). Alternatively, add a
# fine-grained PAT as the SCHEMA_OVERRIDE_PR_TOKEN secret.
name: Schema override PR

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re)build the PR for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write

concurrency:
  group: schema-override-pr-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

jobs:
  create-pr:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        (startsWith(github.event.issue.title, '[missing-inheritance]') ||
         startsWith(github.event.issue.title, '[risky-typecombo]') ||
         startsWith(github.event.issue.title, '[label-mismatch]')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Load issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body > "$RUNNER_TEMP/issue.json"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Apply override changes
        id: apply
        run: |
          export ISSUE_TITLE="$(jq -r .title "$RUNNER_TEMP/issue.json")"
          export ISSUE_BODY="$(jq -r .body "$RUNNER_TEMP/issue.json")"
          bun run .github/scripts/applyOverrideIssue.ts

      - name: Open or update PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SCHEMA_OVERRIDE_PR_TOKEN || github.token }}
          branch: schema-override/issue-${{ steps.issue.outputs.number }}
          add-paths: ${{ steps.apply.outputs.file }}
          commit-message: 'Overrides: apply ${{ steps.apply.outputs.kind }} audit decisions (#${{ steps.issue.outputs.number }})'
          title: 'Overrides: ${{ steps.apply.outputs.kind }} audit decisions (#${{ steps.issue.outputs.number }})'
          labels: schema-override
          body: |
            Applies the override changes from #${{ steps.issue.outputs.number }} to `${{ steps.apply.outputs.file }}`.

            Generated by the **Schema override PR** workflow. To rebuild on top of the latest `main` (e.g. after a merge conflict), re-run the workflow with issue number ${{ steps.issue.outputs.number }}.

            Closes #${{ steps.issue.outputs.number }}

      - name: Run CI on the PR branch
        # create-pull-request reports an operation for new, updated and unchanged PRs.
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.pr.outputs.pull-request-branch }}"
